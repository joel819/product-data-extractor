name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4          # the Apps Script tests run in Node
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m scripts.demo          # the offline demo must keep working

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t product-data-extractor .
      - run: |
          docker run -d --name pde -p 8000:8000 product-data-extractor
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep '"status":"ok"'
          docker run --rm product-data-extractor python -m scripts.demo
