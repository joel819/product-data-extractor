[project]
name = "product-data-extractor"
version = "0.1.0"
description = "Paste a product page URL, get clean structured product data back."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joel Oyewole" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using .httpx. with .starlette.testclient.*",  # Starlette nudging towards a new test client; harmless
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E501", "B011"]   # compact one-line statements in test fixtures are fine
